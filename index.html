:root {
  --bg: #0d0d0e;
  --fg: #f4f4f5;

  --glass: rgba(24,24,26,.72);
  --ph: #1d1d20;
  --sl: env(safe-area-inset-left, 0px);
  --sr: env(safe-area-inset-right, 0px);
  --st: env(safe-area-inset-top, 0px);

* { box-sizing: border-box; }
html, body {
  margin: 0; height: 100%;
  background: var(--bg); color: var(--fg);
  font: 15px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;

body {

}
button {
  font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer;

button:focus-visible, a:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
svg { display: block; }

.top {
  display: flex; align-items: center; gap: 12px;
  padding: calc(10px + var(--st)) calc(14px + var(--sr)) 10px calc(16px + var(--sl));
  position: relative; z-index: 3;

.title span { display: block; color: var(--muted); font-size: 12px; }
.ctrls { display: flex; align-items: center; gap: 4px; }
.count {

  padding: 0 8px; min-width: 64px; text-align: center; white-space: nowrap;
}
.icon {
  width: 40px; height: 40px; border-radius: 12px;
  display: grid; place-items: center;
}
.icon:hover { background: rgba(255,255,255,.08); }
.icon:active { background: rgba(255,255,255,.14); }
.progress { height: 2px; background: var(--line); position: relative; z-index: 3; }
.progress i { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--fg); transition: width .25s ease; }

/* slides */
#track {
  flex: 1; min-height: 0;
  display: flex;
  overflow-x: auto; overflow-y: hidden;
  scroll-snap-type: x mandatory;
  scrollbar-width: none;
  touch-action: pan-x;
  -webkit-overflow-scrolling: touch;
}
#track::-webkit-scrollbar { display: none; }
body.zoomed #track { overflow-x: hidden; touch-action: none; }
.slide {
  flex: 0 0 100%; height: 100%;
  scroll-snap-align: center; scroll-snap-stop: always;
  position: relative; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  padding: 12px calc(12px + var(--sr)) 12px calc(12px + var(--sl));
  container-type: size;
}
.frame {
  position: relative; flex: none;
  aspect-ratio: var(--ar);
  width: min(100cqw, 100cqh * var(--ar));
  background: var(--ph);
  border-radius: 6px; overflow: hidden;
  transform-origin: 0 0;
}
@supports not (width: 1cqw) { .frame { width: 100%; } }
/* only while a finger moves: at rest the browser repaints sharply at the final scale */
.frame.moving { will-change: transform; }
.frame > img { display: block; width: 100%; height: 100%; -webkit-user-drag: none; }
.tiles { position: absolute; inset: 0; pointer-events: none; }
.tiles img { position: absolute; display: block; opacity: 0; transition: opacity .3s ease; }
.tiles img.on { opacity: 1; }

/* loading ring while sharper zoom tiles arrive */
.load {
  position: fixed; z-index: 5; right: calc(14px + var(--sr)); top: 0;
  width: 30px; height: 30px; border-radius: 50%;
  background: rgba(20,20,22,.55);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  display: grid; place-items: center;
  opacity: 0; transform: scale(.7); pointer-events: none;
  transition: opacity .2s ease, transform .2s ease;
}
.load.on { opacity: 1; transform: none; }
.load circle { fill: none; stroke-width: 2.4; }
.load .bg { stroke: rgba(255,255,255,.25); }
.load .fg {
  stroke: #fff; stroke-linecap: round;
  stroke-dasharray: 50.27; stroke-dashoffset: 50.27;
  transform: rotate(-90deg); transform-origin: 50% 50%;
  transition: stroke-dashoffset .25s ease;
}

/* bottom: hint + thumbnails */
.bottom { position: relative; z-index: 3; padding: 0 0 calc(10px + var(--sb)); }
.hint {
  display: none;
  margin: 0 16px 10px; color: var(--muted); font-size: 12.5px;
  align-items: center; justify-content: center; gap: 8px; text-align: center;
  text-wrap: balance;
}
.hint svg { flex: none; }
@media (pointer: coarse) { .hint { display: flex; } }
#thumbs {
  display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none;
  padding: 4px calc(16px + var(--sr)) 4px calc(16px + var(--sl));
  scroll-padding: 0 40%;
}
#thumbs::-webkit-scrollbar { display: none; }
#thumbs button {

  border-radius: 5px; overflow: hidden; position: relative;
  outline: 2px solid transparent; outline-offset: 2px;
  opacity: .55; transition: opacity .2s, outline-color .2s;
  background: var(--ph);
}
#thumbs button.on { opacity: 1; outline-color: var(--fg); }
#thumbs img, #grid img { width: 100%; height: 100%; object-fit: cover; display: block; }

/* side arrows (mouse) */
.nav {
  position: fixed; top: 50%; z-index: 4;
  width: 48px; height: 48px; margin-top: -24px; border-radius: 50%;
  background: var(--glass); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border: 1px solid var(--line);
  display: none; place-items: center;
  transition: opacity .25s, background .15s;
}
.nav:hover { background: rgba(50,50,54,.85); }
.nav[disabled] { opacity: 0 !important; pointer-events: none; }
.prev { left: calc(16px + var(--sl)); }
.next { right: calc(16px + var(--sr)); }
@media (hover: hover) and (pointer: fine) { .nav { display: grid; } }

/* landscape: slide fills the screen, controls float over it and hide */
@media (orientation: landscape) {
  .top {
    position: fixed; top: 0; left: 0; right: 0;
    background: linear-gradient(rgba(13,13,14,.82), rgba(13,13,14,0));
    padding-bottom: 22px;
    transition: opacity .3s, transform .3s;

  .frame { border-radius: 3px; }

/* overview grid */
#grid {
  position: fixed; inset: 0; z-index: 10;

#grid.open { opacity: 1; visibility: visible; transition: opacity .2s; }

#grid .list {

#grid .list button { display: flex; flex-direction: column; gap: 6px; text-align: left; }
#grid .pic {
  width: 100%; aspect-ratio: 5 / 3; border-radius: 6px; overflow: hidden; background: var(--ph);
  outline: 2px solid transparent; outline-offset: 2px;
}
#grid .pic img { object-fit: contain; background: #fff; }
#grid .list button.on .pic { outline-color: var(--fg); }
#grid .list small { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
#grid .list button.on small { color: var(--fg); }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}

  const track = $('track'), thumbs = $('thumbs'), grid = $('grid'), gridList = $('gridList');

    layer.className = 'tiles';
    fr.append(img, layer);

    const t = document.createElement('button');
    t.style.setProperty('--ar', ar(i));
    t.setAttribute('aria-label', `Слайд ${i + 1}`);
    t.innerHTML = `<img src="${src(i, 'thumb')}" alt="" loading="lazy" decoding="async">`;
    t.onclick = () => go(i);
    thumbs.appendChild(t); thumbBtns.push(t);

    g.innerHTML = `<span class="pic"><img src="${src(i, 'thumb')}" alt="" loading="lazy" decoding="async"></span><small>${i + 1}</small>`;

  }

  // ---------- navigation ----------
  let cur = -1;
  const W = () => track.clientWidth;

  function go(i, smooth = true) {
    i = Math.max(0, Math.min(N - 1, i));

    if (smooth && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
      track.scrollTo({ left: i * W(), behavior: 'smooth' });
    } else {

    if (i === cur) return;
    if (cur >= 0) { resetZoom(false); thumbBtns[cur].classList.remove('on'); gridBtns[cur].classList.remove('on'); }
    clearTiles();
    cur = i;
    warmUp(i);
    count.textContent = `${i + 1} / ${N}`;
    bar.style.width = `${((i + 1) / N) * 100}%`;
    prevBtn.disabled = i === 0;
    nextBtn.disabled = i === N - 1;

  function clampZ(g, t) {
    const sw = t.s * g.w, sh = t.s * g.h;
    t.tx = sw <= g.W ? (g.W - sw) / 2 - g.ox : Math.min(-g.ox, Math.max(g.W - sw - g.ox, t.tx));
    t.ty = sh <= g.H ? (g.H - sh) / 2 - g.oy : Math.min(-g.oy, Math.max(g.H - sh - g.oy, t.ty));
    return t;
  }
  function apply(anim) {
    const fr = frames[cur];
    fr.style.transition = anim ? 'transform .28s cubic-bezier(.2,.7,.2,1)' : 'none';
    fr.style.transform = z.s === 1 && !z.tx && !z.ty ? '' : `translate(${z.tx}px, ${z.ty}px) scale(${z.s})`;
    const zoomed = z.s > 1.001;
    body.classList.toggle('zoomed', zoomed);
    if (zoomed) loadBase(cur);
    scheduleTiles();
  }
  const moving = on => { if (cur >= 0) frames[cur].classList.toggle('moving', on); };

  // ---------- sharp zoom: base image, tiles, loading ring ----------
  // Level 0 is the plain image (3200 px); levels 1 and 2 are 2x and 3x, cut into tiles.
  // Only tiles in view are loaded; the blurry level shows underneath until they fade in.
  const baseDone = [];
  function loadBase(i, then) {
    if (baseDone[i]) { if (then) then(); return; }
    if (baseDone[i] === false) return;
    baseDone[i] = false;
    const pre = new Image();
    pre.onload = () => {
      imgs[i].srcset = `${src(i, 3200)} ${SLIDES[i].w}w`;
      baseDone[i] = true;
      progress();
      if (then) then();
    };
    pre.onerror = () => { baseDone[i] = undefined; };
    pre.src = src(i, 3200);
  }

  // While a slide stays on screen, fetch its 3200 px image and then its level-1 tiles in the
  // background (into the browser cache), so zooming in is sharp right away.
  let warmTimer = 0, warmQueue = [], warmBusy = 0;
  function warmUp(i) {
    clearTimeout(warmTimer);
    warmQueue = [];
    warmTimer = setTimeout(() => loadBase(i, () => {
      if (cur !== i) return;
      const [lw, lh] = SLIDES[i].levels[0];
      for (let r = 0; r < Math.ceil(lh / TILE); r++)
        for (let c = 0; c < Math.ceil(lw / TILE); c++) warmQueue.push(tileSrc(i, 1, c, r));
      pump();
    }), 500);
  }
  function pump() {
    while (warmBusy < 3 && warmQueue.length) {
      const im = new Image();
      im.fetchPriority = 'low';
      warmBusy++;
      im.onload = im.onerror = () => { warmBusy--; pump(); };
      im.src = warmQueue.shift();
    }
  }

  const tiles = new Map();   // "level/col/row" -> <img>, current slide only
  let tilesOf = -1, want = [], tileRaf = 0, dropTimer = 0;
  function clearTiles() {
    if (tilesOf >= 0) layers[tilesOf].textContent = '';
    tiles.clear(); want = []; tilesOf = -1;
    clearTimeout(dropTimer);
    progress();
  }
  function scheduleTiles() {
    if (!tileRaf) tileRaf = requestAnimationFrame(() => { tileRaf = 0; updateTiles(); });
  }
  function updateTiles() {
    if (cur < 0) return;
    if (tilesOf !== cur) { clearTiles(); tilesOf = cur; }
    const S = SLIDES[cur], g = geom();
    const need = g.w * z.s * (devicePixelRatio || 1);
    const widths = [S.w, ...S.levels.map(l => l[0])];
    let level = 0;
    while (level < widths.length - 1 && need > widths[level] * 1.15) level++;
    clearTimeout(dropTimer);
    if (!level) {
      want = [];
      // back at full view: free the tiles once the zoom-out animation is over
      if (tiles.size) dropTimer = setTimeout(() => { if (cur === tilesOf) { layers[cur].textContent = ''; tiles.clear(); } }, 400);
      progress();
      return;
    }
    const [lw, lh] = S.levels[level - 1];
    const kx = lw / (g.w * z.s), ky = lh / (g.h * z.s);
    const cols = Math.ceil(lw / TILE), rows = Math.ceil(lh / TILE);
    const span = (a, b, n) => [Math.max(0, Math.floor(a / TILE)), Math.min(n - 1, Math.floor(b / TILE))];
    const [c0, c1] = span((-g.ox - z.tx) * kx, (g.W - g.ox - z.tx) * kx, cols);
    const [r0, r1] = span((-g.oy - z.ty) * ky, (g.H - g.oy - z.ty) * ky, rows);
    const cc = (c0 + c1) / 2, rc = (r0 + r1) / 2;
    const list = [];
    for (let r = Math.max(0, r0 - 1); r <= Math.min(rows - 1, r1 + 1); r++)
      for (let c = Math.max(0, c0 - 1); c <= Math.min(cols - 1, c1 + 1); c++)
        list.push({ c, r, inView: c >= c0 && c <= c1 && r >= r0 && r <= r1, d: Math.hypot(c - cc, r - rc) });
    list.sort((a, b) => (b.inView - a.inView) || (a.d - b.d));   // visible first, from the centre out
    want = [];
    const keep = new Set();
    for (const t of list) {
      const key = `${level}/${t.c}/${t.r}`;
      keep.add(key);
      if (t.inView) want.push(key);
      if (!tiles.has(key)) addTile(level, t.c, t.r, key, lw, lh);
    }
    // Drop sharper tiles after zooming out, and far-away ones once there are many.
    for (const [key, im] of tiles) {
      const l = +key[0];
      if (l > level || (tiles.size > 96 && !keep.has(key))) { im.remove(); tiles.delete(key); }
    }
    progress();
  }
  function addTile(l, c, r, key, lw, lh) {
    const x = c * TILE, y = r * TILE;
    const w = Math.min(TILE + 1, lw - x), h = Math.min(TILE + 1, lh - y);
    const im = new Image();
    im.alt = '';
    im.decoding = 'async';
    im.style.cssText = `left:${x / lw * 100}%;top:${y / lh * 100}%;width:${w / lw * 100}%;height:${h / lh * 100}%;z-index:${l}`;
    im.onload = () => { im.done = true; im.classList.add('on'); progress(); };
    im.onerror = () => { im.done = true; progress(); };
    im.src = tileSrc(cur, l, c, r);
    layers[cur].appendChild(im);
    tiles.set(key, im);
  }

  // Ring in the corner, shown only while zoomed in and something in view is still loading.
  const load = $('load'), ring = $('loadRing'), CIRC = 50.27;
  let ringTimer = 0, hideTimer = 0;
  function progress() {
    let total = want.length, done = 0;
    for (const key of want) { const im = tiles.get(key); if (im && im.done) done++; }
    if (cur >= 0 && !baseDone[cur]) total++;
    const pending = z.s > 1.001 && done < total;
    ring.style.strokeDashoffset = CIRC * (1 - (total ? done / total : 1));
    if (pending) {
      clearTimeout(hideTimer); hideTimer = 0;
      if (!load.classList.contains('on') && !ringTimer)
        ringTimer = setTimeout(() => { ringTimer = 0; load.classList.add('on'); }, 250);
    } else {
      clearTimeout(ringTimer); ringTimer = 0;
      if (load.classList.contains('on') && !hideTimer)
        hideTimer = setTimeout(() => { hideTimer = 0; load.classList.remove('on'); }, 300);
    }
  }
  function placeLoader() {
    load.style.top = `${track.getBoundingClientRect().bottom - 44}px`;
  }
  function resetZoom(anim = true) {
    if (cur < 0) return;
    if (z.s === 1 && !z.tx && !z.ty) return;
    z = { s: 1, tx: 0, ty: 0 };
    apply(anim);
  }
  // Zoom to scale s keeping the client point (cx, cy) fixed.
  function zoomAt(s, cx, cy, anim, base = z) {
    const g = geom();
    const px = cx - g.r.left, py = cy - g.r.top;
    const u = (px - g.ox - base.tx) / base.s, v = (py - g.oy - base.ty) / base.s;
    z = { s, tx: px - g.ox - s * u, ty: py - g.oy - s * v };
    if (anim) clampZ(g, z);
    apply(anim);
  }
  function toggleZoomAt(cx, cy) {
    if (z.s > 1.001) resetZoom(true);
    else zoomAt(2.5, cx, cy, true);
  }

  // Touch: native horizontal swipe between slides; pinch, pan-when-zoomed and taps are ours.
  let pinch = null, pan = null, tap = null, lastTap = null, tapTimer = 0;
  const dist = (a, b) => Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
  const mid = (a, b) => ({ x: (a.clientX + b.clientX) / 2, y: (a.clientY + b.clientY) / 2 });

  track.addEventListener('touchstart', e => {
    const t = e.touches;
    if (t.length === 2) {
      e.preventDefault();
      tap = null; pan = null;
      track.scrollLeft = cur * W();
      const m = mid(t[0], t[1]);
      pinch = { d: dist(t[0], t[1]), x: m.x, y: m.y, base: { ...z } };
      moving(true);
    } else if (t.length === 1) {
      tap = { x: t[0].clientX, y: t[0].clientY, time: Date.now() };
      if (z.s > 1.001) { pan = { x: t[0].clientX, y: t[0].clientY, tx: z.tx, ty: z.ty }; moving(true); }
    } else { tap = null; }
  }, { passive: false });

  track.addEventListener('touchmove', e => {
    const t = e.touches;
    if (pinch && t.length === 2) {
      e.preventDefault();
      const m = mid(t[0], t[1]);
      const s = Math.max(.85, Math.min(MAX * 1.15, pinch.base.s * dist(t[0], t[1]) / pinch.d));
      // keep the content point under the initial centre under the moving centre
      const g = geom();
      const u = (pinch.x - g.r.left - g.ox - pinch.base.tx) / pinch.base.s;
      const v = (pinch.y - g.r.top - g.oy - pinch.base.ty) / pinch.base.s;
      z = { s, tx: m.x - g.r.left - g.ox - s * u, ty: m.y - g.r.top - g.oy - s * v };
      apply(false);
      return;
    }
    if (tap && t.length === 1 && Math.hypot(t[0].clientX - tap.x, t[0].clientY - tap.y) > 10) tap = null;
    if (pan && t.length === 1) {
      e.preventDefault();
      z.tx = pan.tx + t[0].clientX - pan.x;
      z.ty = pan.ty + t[0].clientY - pan.y;
      clampZ(geom(), z);
      apply(false);
    } else if (z.s > 1.001) {
      e.preventDefault();
    }
  }, { passive: false });

  function endTouch(e) {
    if (pinch && e.touches.length < 2) {
      pinch = null;
      const g = geom();
      if (z.s < 1.05) z = { s: 1, tx: 0, ty: 0 };
      else if (z.s > MAX) {
        const cx = g.r.left + g.W / 2, cy = g.r.top + g.H / 2;
        const u = (cx - g.r.left - g.ox - z.tx) / z.s, v = (cy - g.r.top - g.oy - z.ty) / z.s;
        z = { s: MAX, tx: g.W / 2 - g.ox - MAX * u, ty: g.H / 2 - g.oy - MAX * v };
      }
      clampZ(g, z);
      apply(true);
      if (e.touches.length === 1 && z.s > 1.001) {
        const t = e.touches[0];
        pan = { x: t.clientX, y: t.clientY, tx: z.tx, ty: z.ty };
      } else moving(false);
      tap = null;
      return;
    }
    if (e.touches.length) return;
    pan = null;
    moving(false);
    if (!tap || e.type === 'touchcancel' || Date.now() - tap.time > 350) { tap = null; return; }
    const p = tap; tap = null;
    if (lastTap && p.time - lastTap.time < 320 && Math.hypot(p.x - lastTap.x, p.y - lastTap.y) < 40) {
      clearTimeout(tapTimer);
      lastTap = null;
      e.preventDefault();
      toggleZoomAt(p.x, p.y);
    } else {
      lastTap = p;
      clearTimeout(tapTimer);
      tapTimer = setTimeout(() => { lastTap = null; if (landscape.matches) toggleCalm(); }, 320);
    }
  }
  track.addEventListener('touchend', endTouch, { passive: false });
  track.addEventListener('touchcancel', endTouch);
  // Stop iOS Safari page zoom.
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('gesturechange', e => e.preventDefault());

  // Mouse: double-click zoom, drag to pan, ctrl+wheel / trackpad pinch.
  let lastTouch = 0;
  track.addEventListener('touchstart', () => { lastTouch = Date.now(); }, { passive: true, capture: true });
  track.addEventListener('dblclick', e => { if (Date.now() - lastTouch < 1000) return; toggleZoomAt(e.clientX, e.clientY); });
  let drag = null;
  track.addEventListener('mousedown', e => {
    if (z.s <= 1.001 || e.button) return;
    e.preventDefault();
    drag = { x: e.clientX, y: e.clientY, tx: z.tx, ty: z.ty };
    moving(true);
    track.style.cursor = 'grabbing';
  });
  addEventListener('mousemove', e => {
    if (!drag) return;
    z.tx = drag.tx + e.clientX - drag.x; z.ty = drag.ty + e.clientY - drag.y;
    clampZ(geom(), z); apply(false);
  });
  addEventListener('mouseup', () => { if (drag) moving(false); drag = null; track.style.cursor = ''; });
  let wheelTimer = 0;
  track.addEventListener('wheel', e => {
    if (e.ctrlKey || z.s > 1.001) { moving(true); clearTimeout(wheelTimer); wheelTimer = setTimeout(() => moving(false), 200); }
    if (e.ctrlKey) {
      e.preventDefault();
      const s = Math.max(1, Math.min(MAX, z.s * Math.exp(-e.deltaY / 100)));
      zoomAt(s, e.clientX, e.clientY, false);
      clampZ(geom(), z); apply(false);
      if (s === 1) resetZoom(false);
    } else if (z.s > 1.001) {
      e.preventDefault();
      z.tx -= e.deltaX; z.ty -= e.deltaY;
      clampZ(geom(), z); apply(false);
    }
  }, { passive: false });

  // ---------- keyboard ----------
  addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (grid.classList.contains('open')) { if (e.key === 'Escape' || e.key === 'g' || e.key === 'п') closeGrid(); return; }
    switch (e.key) {
      case 'ArrowRight': case 'PageDown': case ' ': e.preventDefault(); go(cur + 1); break;
      case 'ArrowLeft': case 'PageUp': e.preventDefault(); go(cur - 1); break;
      case 'Home': go(0); break;
      case 'End': go(N - 1); break;
      case 'Escape': resetZoom(true); break;
      case 'g': case 'п': openGrid(); break;
      case 'f': case 'а': if (canFs) toggleFs(); break;
      default: return;
    }
    wake();
  });

  // ---------- start ----------
  const start = Math.max(0, Math.min(N - 1, (parseInt(location.hash.slice(1), 10) || 1) - 1));
  lastW = W();
  track.scrollLeft = start * W();
  setCur(start);
  requestAnimationFrame(() => { track.scrollLeft = start * W(); });
  wake(3000);
})();
</script>
</body>
</html>
